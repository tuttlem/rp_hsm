name: CI

on:
  push:
    branches:
      - main
      - master
      - "feature/**"
      - "spec/**"
      - "release/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: riscv32imac-unknown-none-elf

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Test protocol
        run: cargo test -p rp_hsm --target x86_64-unknown-linux-gnu

      - name: Test host tools
        run: cargo test -p host_tools

      - name: Clippy protocol
        run: cargo clippy -p rp_hsm --target x86_64-unknown-linux-gnu --tests -- -W clippy::pedantic

      - name: Clippy host tools
        run: cargo clippy -p host_tools -- -W clippy::pedantic

      - name: Build firmware developer image
        run: cargo build -p firmware --target riscv32imac-unknown-none-elf --features developer-mode

      - name: Build host tools release binaries
        run: cargo build -p host_tools --release --bins

      - name: Package CI artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/firmware dist/host-tools/linux-x86_64
          cp target/riscv32imac-unknown-none-elf/debug/rp_hsm dist/firmware/rp_hsm-developer.elf
          cp target/release/rphsmtool dist/host-tools/linux-x86_64/rphsmtool
          cp target/release/probe_protocol dist/host-tools/linux-x86_64/probe_protocol
          tar -C dist/host-tools/linux-x86_64 -czf dist/rphsmtool-linux-x86_64.tar.gz .
          sha256sum \
            dist/firmware/rp_hsm-developer.elf \
            dist/rphsmtool-linux-x86_64.tar.gz > dist/SHA256SUMS.txt

      - name: Verify CI firmware artifact shape
        shell: bash
        run: |
          set -euo pipefail
          ls -lh dist/firmware
          file dist/firmware/rp_hsm-developer.elf
          test "$(stat -c%s dist/firmware/rp_hsm-developer.elf)" -gt 100000

      - name: Upload CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts
          path: dist/

  host-tools:
    name: Host Tools (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archive_name: rphsmtool-linux-x86_64.tar.gz
            binary_suffix: ""
          - os: macos-latest
            archive_name: rphsmtool-macos.tar.gz
          - os: windows-latest
            archive_name: rphsmtool-windows-x86_64.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build host tools release binaries
        run: cargo build -p host_tools --release --bins

      - name: Package host tools archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/rphsmtool dist/rphsmtool
          cp target/release/probe_protocol dist/probe_protocol
          tar -C dist -czf "${{ matrix.archive_name }}" rphsmtool probe_protocol

      - name: Package host tools archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/rphsmtool.exe dist/rphsmtool.exe
          Copy-Item target/release/probe_protocol.exe dist/probe_protocol.exe
          Compress-Archive -Path dist/rphsmtool.exe,dist/probe_protocol.exe -DestinationPath ${{ matrix.archive_name }} -Force

      - name: Upload host tools archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: ${{ matrix.archive_name }}
